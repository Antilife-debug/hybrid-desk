const SPECS=Object.fromEntries(R.map(([sym,name,cat,tick,pv,base,src=cat==='Futures'?'databento':'sim'])=>

// 75 deterministic analysis agents = 5 squads x 15 parameter variants. Rule-based (no LLM calls, no latency).
// Each agent returns support in [-1,1] for the direction of the detected setup (ctx.d). Risk agents return a 0..1 gate.
// Consensus = mean of the 60 directional votes, scaled by the mean Risk gate. The engine only signals if consensus > 0.15.
const cl=x=>Math.max(-1,Math.min(1,x)),sum=(a,f)=>a.reduce((s,c)=>s+f(c),0);
const atr=(C,n)=>sum(C.slice(-n),c=>c.h-c.l)/Math.max(1,Math.min(n,C.length))||1e-9;
const N=[2,3,4,5,6,8,10,12,14,16,18,20,24,28,32];

const AGENTS=[
 // Momentum: net displacement in the first n bars after the sweep, in ATR units
 ...N.map(n=>({sq:'Momentum',id:`MOM-${n}`,f:({W,d})=>{const k=Math.min(n,W.length-1);return cl(d*(W[k].c-W[0].c)/(atr(W,W.length)*Math.sqrt(Math.max(k,1))))}})),
 // Structure: where price sits vs the pre-sweep range after n bars (character change)
 ...N.map(n=>({sq:'Structure',id:`STR-${n}`,f:({C,W,si,d})=>{const s=C.slice(Math.max(0,si-n),si+1),h=Math.max(...s.map(c=>c.h)),l=Math.min(...s.map(c=>c.l));return cl(d*(W[Math.min(n,W.length-1)].c-(h+l)/2)/((h-l)/2||1))}})),
 // Liquidity: proximity to the level that was swept (4 levels x 3 distance scales) + 3 sweep-recency agents
 ...[.5,1,2].flatMap(k=>[['pdl',1],['al',1],['pdh',-1],['ah',-1]].map(([key,s])=>({sq:'Liquidity',id:`LIQ-${key}-${k}`,f:({C,L,d})=>Math.abs(C[C.length-1].c-L[key])<atr(C,20)*k*3?s*d*.8:0}))),
 ...[10,20,40].map(w=>({sq:'Liquidity',id:`SWP-${w}`,f:({C,bub,d})=>{const b=bub[bub.length-1],age=C.length-1-b.i;return age<w?d*b.d*(1-age/w):0}})),
 // OrderFlow: aggressive buy ratio (taker volume) over the first n bars after the sweep
 ...N.map(n=>({sq:'OrderFlow',id:`OF-${n}`,f:({W,d})=>{const s=W.slice(0,n+1);return cl(d*(sum(s,c=>c.bv)/sum(s,c=>c.v)-.5)*5)}})),
 // Risk: volatility regime gate (blocks dead or chaotic markets)
 ...N.map(n=>({sq:'Risk',id:`RSK-${n}`,f:({C})=>{const r=atr(C,n+3)/atr(C,60);return r>.4&&r<2.5?1:.4}}))];
function runAgents(ctx){
 const on=!!ctx.d&&ctx.W.length>1,votes=AGENTS.map(a=>({sq:a.sq,id:a.id,v:on?a.f(ctx):0}));
 const m=s=>{const x=votes.filter(v=>v.sq===s);return sum(x,v=>v.v)/x.length};

// Phase4o4 rules (levels, sweep, MSS, OTE) fused with order-flow (volume spike, taker imbalance, HVN).
// Pipeline: levels -> HVN -> sweep+absorption bubble -> MSS + stacked imbalance -> OTE retrace -> agent consensus -> signal.
const hi=a=>Math.max(...a.map(c=>c.h)),lo=a=>Math.min(...a.map(c=>c.l));
function analyze(C,spec,slTicks=4){
 const out={levels:null,hvn:[],hvnMax:1,bubbles:[],imb:[],mss:null,ote:null,setup:null,signal:null,stages:{},agents:runAgents({W:[],d:0})};
 const n=C.length;if(n<40)return out;
 // Previous-day / Asia ranges come from session tags set by the feed (fallback: proportional blocks)
 const P=C.filter(c=>c.s==='P'),A=C.filter(c=>c.s==='A');
 const pd=P.length>9?P:C.slice(0,Math.floor(n*.4)),as=A.length>4?A:C.slice(Math.floor(n*.4),Math.floor(n*.55));
 const L=out.levels={pdh:hi(pd),pdl:lo(pd),ah:hi(as),al:lo(as)};
 // HVN: volume-at-price histogram, bins well above average volume
 const mn=lo(C),nb=28,bw=(hi(C)-mn)/nb||1,bins=Array(nb).fill(0);
 C.forEach(c=>bins[Math.min(nb-1,Math.floor(((c.h+c.l)/2-mn)/bw))]+=c.v);
 const avg=bins.reduce((a,b)=>a+b,0)/nb;out.hvnMax=Math.max(...bins);
 out.hvn=bins.map((v,i)=>({price:mn+(i+.5)*bw,vol:v,bw})).filter(b=>b.vol>avg*1.6);
 // Sweep + absorption: wick through a level, close back inside, volume spike, small body (stalled)
 const av=C.reduce((s,c)=>s+c.v,0)/n,start=Math.max(C.indexOf(as[as.length-1])+1,7);
 for(let i=start;i<n;i++){
  const c=C[i],rg=c.h-c.l||1e-9;
  if(!(c.v>av*1.8&&Math.abs(c.c-c.o)<rg*.5))continue;
  const d=(c.l<L.pdl&&c.c>L.pdl)||(c.l<L.al&&c.c>L.al)?1:(c.h>L.pdh&&c.c<L.pdh)||(c.h>L.ah&&c.c<L.ah)?-1:0;
  if(d)out.bubbles.push({i,t:c.t,d,price:d>0?c.l:c.h,vol:c.v,r:Math.min(.9,.22+.16*c.v/av)});
 }
 const b=out.bubbles[out.bubbles.length-1];out.stages.sweep=!!b;if(!b)return out;
 const {i:si,d}=b,sw=C.slice(si-6,si),swing=d>0?hi(sw):lo(sw);
 // MSS: first close beyond the pre-sweep swing
 let j=-1;for(let k=si+1;k<n;k++)if(d>0?C[k].c>swing:C[k].c<swing){j=k;break}
 out.stages.mss=j>0;if(j<0)return out;
 out.mss={from:si,to:j,price:swing,d};
 // Stacked imbalance: displacement candles dominated by aggressive buyers (>62%) or sellers (<38%)
 for(let k=si+1;k<=j;k++){const r=C[k].bv/C[k].v;if(d>0?r>.62:r<.38)out.imb.push({i:k,d,o:C[k].o,c:C[k].c})}
 out.stages.imb=out.imb.length>=2;
 // OTE: 61.8%-78.6% retracement of the leg from the absorption extreme to the post-MSS extreme
 const post=C.slice(j),ext=d>0?hi(post):lo(post),r=Math.abs(ext-b.price);
 const z=[ext-d*.618*r,ext-d*.786*r];out.ote={lo:Math.min(...z),hi:Math.max(...z),from:j,d};
 const last=C[n-1].c,inZone=last>=out.ote.lo&&last<=out.ote.hi,valid=d>0?last>b.price:last<b.price;
 out.stages.ote=inZone;
 // Levels: entry mid-OTE, SL behind bubble extreme, TP1 nearest opposing HVN, TP2 opposing PDH/PDL
 const entry=snap((z[0]+z[1])/2,spec.tick),sl=snap(b.price-d*slTicks*spec.tick,spec.tick);
 const tp1=snap(out.hvn.map(h=>h.price).filter(p=>(p-entry)*d>spec.tick*4).sort((a,c)=>Math.abs(a-entry)-Math.abs(c-entry))[0]??ext,spec.tick);
 let tp2=d>0?L.pdh:L.pdl;if((tp2-tp1)*d<=0)tp2=ext+d*.5*r;tp2=snap(tp2,spec.tick);

 out.setup={d,side:d>0?'BUY':'SELL',entry,sl,tp1,tp2,riskTicks:Math.round(risk/spec.tick),rewardTicks:Math.round(Math.abs(tp2-entry)/spec.tick),rr:+(Math.abs(tp2-entry)/risk).toFixed(2),from:j,bubble:b};

}
const formatAlert=(s,spec)=>{const f=p=>Number(p).toFixed(spec.dec);

// Feed layer. Crypto = live Binance (no key). Everything else = scripted simulator that plays full
// sweep -> displacement -> OTE retrace stories so the 3D scene animates on launch.
// TODO(real feeds): add adapters for Databento (futures), Twelve Data / Finnhub (forex, stocks) next to binance().
const MS={'1m':6e4,'5m':3e5,'15m':9e5,'1H':36e5,'4H':144e5},BI={'1m':'1m','5m':'5m','15m':'15m','1H':'1h','4H':'4h'};
// Session tags. roll = UTC hour the trading day starts: 0 for 24/7 markets, 22 for CME (21 in US summer time).
const tagSessions=(C,roll=0)=>{const day=t=>Math.floor((t-roll*36e5)/864e5),td=day(C[C.length-1].t);

// Every USDT spot pair and USDT perpetual on Binance (hundreds of symbols, includes the gold/silver/stock perps), added to SPECS with real tick sizes.
async function loadUniverse(SPECS){
 const get=u=>fetch(u).then(r=>r.json()),dp=t=>(t.replace(/0+$/,'').split('.')[1]||'').length;
 const mk=(s,cat,src)=>{const t=s.filters.find(x=>x.filterType==='PRICE_FILTER').tickSize;return {sym:s.symbol,name:`${s.baseAsset}/${s.quoteAsset}${src==='binancefut'?' perp':''}`,cat,tick:+t,pv:1,base:0,src,dec:dp(t)}};
 let n=0;
 try{for(const s of (await get('https://api.binance.com/api/v3/exchangeInfo')).symbols)if(s.quoteAsset==='USDT'&&s.status==='TRADING'&&s.isSpotTradingAllowed&&!SPECS[s.symbol]){SPECS[s.symbol]=mk(s,'Crypto','binance');n++}}catch{}
 try{for(const s of (await get('https://fapi.binance.com/fapi/v1/exchangeInfo')).symbols)if(s.quoteAsset==='USDT'&&s.contractType==='PERPETUAL'&&s.status==='TRADING'&&!SPECS[s.symbol]){SPECS[s.symbol]=mk(s,'Binance perps','binancefut');n++}}catch{}
 return n;
}
const cand=k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5],bv:+k[9]});
// Binance spot (crypto) and USDⓈ-M futures (gold XAUUSDT, silver XAGUSDT): free, 24/7, real volume + taker-buy volume.
// Reconnects with backoff, re-downloads history after a drop (no gaps), and restarts a socket that goes quiet for 30s.
async function binance(spec,tf,push,status){
 const fut=spec.src==='binancefut',rest=fut?'https://fapi.binance.com/fapi/v1':'https://api.binance.com/api/v3',wss=fut?'wss://fstream.binance.com/ws':'wss://stream.binance.com:9443/ws';
 try{const ex=await fetch(fut?`${rest}/exchangeInfo`:`${rest}/exchangeInfo?symbol=${spec.sym}`).then(r=>r.json()),
  f=ex.symbols.find(x=>x.symbol===spec.sym).filters.find(x=>x.filterType==='PRICE_FILTER');
  if(f){spec.tick=+f.tickSize;spec.dec=(f.tickSize.replace(/0+$/,'').split('.')[1]||'').length}}catch{} // real tick size from the exchange
 let C=[],ws,dead=false,last=Date.now(),tries=0;
 const hist=async()=>{C=(await fetch(`${rest}/klines?symbol=${spec.sym}&interval=${BI[tf]}&limit=500`).then(r=>r.json())).map(cand);push(tagSessions(C,0))};
 await hist();status('Live · Binance');
 const open=()=>{ws=new WebSocket(`${wss}/${spec.sym.toLowerCase()}@kline_${BI[tf]}`);
  ws.onopen=()=>{last=Date.now();status('Live · Binance');if(tries>0)hist().catch(()=>{});tries=0};
  ws.onmessage=e=>{last=Date.now();const k=JSON.parse(e.data).k;if(!k)return;const c={t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v,bv:+k.V};
   C[C.length-1].t===c.t?C[C.length-1]=c:C.push(c);C=C.slice(-400);push(tagSessions(C,0))};
  ws.onclose=()=>{if(dead)return;status('Connection lost · reconnecting…');setTimeout(open,Math.min(3e4,1e3*2**tries++))};
  ws.onerror=()=>{try{ws.close()}catch{}}};
 open();
 const dog=setInterval(()=>{if(Date.now()-last>3e4){status('Feed stalled · reconnecting…');last=Date.now();try{ws.close()}catch{}}},1e4);
 return ()=>{dead=true;clearInterval(dog);try{ws.close()}catch{}};
}
// One scripted day: prev-day range, Asia range, run at liquidity, sweep spike, displacement, OTE retrace, continuation.
function scenario(p0,ms,t0){
 const d=Math.random()<.5?1:-1,R=p0*.004,out=[];let p=p0,t=t0;
 const add=(c,v,r,wu=.05,wd=.05,s)=>{const vv=v*(.8+Math.random()*.4);
  out.push({t:t+=ms,o:p,h:Math.max(p,c)+R*wu,l:Math.min(p,c)-R*wd,c,v:vv,bv:vv*(r+(Math.random()-.5)*.08),s});p=c};
 for(let k=0;k<40;k++)add(p0+R*Math.sin(k/6)+R*.15*(Math.random()-.5),100,.5,.05,.05,'P');
 for(let k=0;k<20;k++)add(p0+.3*R*Math.sin(k/3)+R*.05*(Math.random()-.5),80,.5,.05,.05,'A');
 for(let k=1;k<=4;k++)add(p+(p0-d*1.1*R-p)*(k/4)*(k<4?.6:1),100,.5-d*.04);
 add(p0-d*1.0*R,300,.5,d>0?.05:.5,d>0?.5:.05);                 // sweep candle: long wick, small body, volume spike
 for(let k=0;k<4;k++)add(p+d*.55*R,200,d>0?.75:.25);            // displacement: stacked aggressive imbalance
 const ext=p,tgt=ext+(p0-d*1.5*R-ext)*.7;
 for(let k=1;k<=8;k++)add(ext+(tgt-ext)*k/8,90,.5);             // retrace into the OTE zone
 for(let k=1;k<=10;k++)add(tgt+(p0+d*1.3*R-tgt)*k/10,110,d>0?.6:.4);
 return out;

async function databento(spec,tf,push,status,onFail){

 es.onopen=()=>status('Live · Databento CME');es.onerror=()=>status('Databento connection lost · reconnecting…');
 es.addEventListener('t',e=>{for(const [ts,p,sz,buy] of JSON.parse(e.data)){
  const b=Math.floor(ts/ms)*ms;if(!C.length||C[C.length-1].t!==b)C.push({t:b,o:p,h:p,l:p,c:p,v:0,bv:0});

function simulate(spec,tf,push){
 const ms=MS[tf];let scen=scenario(spec.base,ms,Date.now()-90*ms),cur=62,prog=0,hist=scen.slice(0,cur);
 const emit=()=>{const k=scen[cur],o=k.o,c=o+(k.c-o)*prog;
  const part=prog?[{...k,c,h:Math.max(o,c)+(k.h-Math.max(k.o,k.c))*prog,l:Math.min(o,c)-(Math.min(k.o,k.c)-k.l)*prog,v:k.v*prog,bv:k.bv*prog}]:[];
  push([...hist,...part].slice(-130))};
 emit();
 const id=setInterval(()=>{prog+=1/3;
  if(prog>=.99){prog=0;hist.push(scen[cur]);cur++;
   if(cur>=scen.length){hist=hist.slice(-40).map(({s,...c})=>c);const l=hist[hist.length-1];scen=scenario(l.c,ms,l.t);cur=0}}

}

// Follows open trades after the signal and reports TP1 / TP2 / SL / expiry once each.
// If one candle touches both stop and target, the stop is assumed first (conservative).
function updateTrades(T,C,spec,maxBars=100){
 const ev=[],f=p=>spec?Number(p).toFixed(spec.dec):p;
 for(const x of T){if(x.status!=='open')continue;let bars=0;
  const say=(label,p,icon)=>{x.status=label;ev.push({key:x.key,symbol:x.symbol,label,text:`${icon} ${x.symbol} ${label} @ ${f(p)} (${x.side} from ${f(x.entry)})`})};
  for(const c of C){if(c.t<=x.t0)continue;bars++;
   if(x.d>0?c.l<=x.sl:c.h>=x.sl){say('Stop hit',x.sl,'❌');break}
   if(x.d>0?c.h>=x.tp2:c.l<=x.tp2){say('TP2 hit',x.tp2,'🏁');break}
   if(!x.tp1Hit&&(x.d>0?c.h>=x.tp1:c.l<=x.tp1)){x.tp1Hit=true;ev.push({key:x.key,symbol:x.symbol,label:'TP1 hit',text:`✅ ${x.symbol} TP1 hit @ ${f(x.tp1)} (${x.side} from ${f(x.entry)})`})}
   if(bars>=maxBars){say('Expired',c.c,'⏱');break}}}
 return ev;
}
